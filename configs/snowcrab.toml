# Snow Crab (Chionoecetes opilio) movement analysis
# =============================================================================
# Scotian Shelf snow crab mark-recapture dataset, resharded to a 5 km hexagonal
# lattice and restricted to the 25-350 m benthic habitat band.
#
#   julia --project=. GeoMotionRun.jl --config=configs/snowcrab.toml
#
# Every parameter specified here overrides the default declared in
# `GeoMotionConfig`, and command-line flags override this file.
# =============================================================================

# -----------------------------------------------------------------------------
# Approaches to fit
# -----------------------------------------------------------------------------
# Fitted mark-recapture telemetry transition kernel and forward agent projection.
# "telemetry_and_survey" is omitted because no paired survey density file is supplied.
model_modes = ["telemetry", "agent"]

# -----------------------------------------------------------------------------
# Input files
# -----------------------------------------------------------------------------
tagging_file = "data/tagging.jld2"   # Mark-recapture release/recapture events
hsi_file = "data/hsi.jld2"           # Habitat suitability time series
sppoly_file = "data/sppoly.jld2"     # Spatial polygon unit definitions
# surveydata_file = "data/surveydata.jld2" # Paired survey observations (optional)

# -----------------------------------------------------------------------------
# Spatial domain
# -----------------------------------------------------------------------------
# Derived from telemetry observations with 0.25 deg buffer margin.
# bbox = [-64.5, 43.0, -58.5, 47.5]
bbox_padding_deg = 0.25

# Land is identified from a global land/sea raster rather than a bundled coastline,
# supplemented by high-resolution Sable Island polygons.
land_source = "landmask"
land_mask_resolution = "l"   # "c", "l", "i", "h", or "f"
land_mask_grid_minutes = 5.0
land_polygon_files = ["configs/geo/sable_island.geojson"]

# Domain resharding and benthic depth constraints
reshard_hex = false
hex_radius_km = 5.0
use_hydrodynamics = true
depth_barrier_mode = "hsi_only"  # "hsi_only" | "bathy_only" | "intersection"
depth_range = [25.0, 350.0]      # Principal benthic habitat band in metres
hsi_ood_floor = 0.01

# -----------------------------------------------------------------------------
# Path reconstruction & Routing
# -----------------------------------------------------------------------------
max_paths = 25                   # Trajectories to reconstruct
path_methods = ["astar"]         # Least-cost heuristic routing
smooth_paths = true              # Marine line-of-sight smoothing

# -----------------------------------------------------------------------------
# Dynamic Environmental Features & Advanced Routing
# -----------------------------------------------------------------------------
adaptive_mesh = false
coarse_radius_km = 25.0
fine_radius_km = 8.0
dynamic_kernels = true           # Enable time-varying seasonal HSI kernels
hmm_smoothing = false

# -----------------------------------------------------------------------------
# Habitat-Coupled Residency
# -----------------------------------------------------------------------------
rest_advantage = 0.0
rest_advantage_form = "difference"

# -----------------------------------------------------------------------------
# Habitat Suitability & GeoData Environmental Sources
# -----------------------------------------------------------------------------
use_geodata_habitat = true           # Query real physical habitat via GeoData
temperature_source = "glorys12v1"    # Copernicus Marine GLORYS12V1 (1/12 deg)
temperature_month = 0                # 0 for dynamic seasonal sequence / 1-12 for fixed
bathymetry_source = "etopo2022"      # Bathymetry elevation/depth source
spatial_averaging = "polygon"        # Polygon area average across vertices & centroid
hsi_dynamic_method = "glorys_monthly"# Time-varying bottom temperature series
circuit_timescale = "annual_average" # Steady-state DC current uses 12-month annual mean

# -----------------------------------------------------------------------------
# Forward Agent Projection
# -----------------------------------------------------------------------------
persistence = 0.0
n_headings = 8
n_agent_projections = 200
agent_horizon = 50

# -----------------------------------------------------------------------------
# Posterior Inference (MCMC)
# -----------------------------------------------------------------------------
n_samples = 500
n_warmup = 100
seed = 42
n_ensemble = 50
mh_proposal_scale = 0.05

# -----------------------------------------------------------------------------
# Habitat Suitability Uncertainty
# -----------------------------------------------------------------------------
hsi_se = 0.08
propagate_hsi_error = true
n_stochastic_draws = 100
add_structural_uncertainty = false
structural_uncertainty_scale = 0.05

# -----------------------------------------------------------------------------
# Diagnostics & Downstream Analysis
# -----------------------------------------------------------------------------
diagnostics = ["circuit", "stochastic", "bottlenecks", "validation"]

# -----------------------------------------------------------------------------
# Output & Visualization
# -----------------------------------------------------------------------------
species_name = "Snow Crab"
render_html = true
output_dir = "output"
resume_from_checkpoint = false
dark_mode = false
cmap = "viridis"
overlay_hsi = false
verbose = true

# -----------------------------------------------------------------------------
# Stock Connectivity Regions
# -----------------------------------------------------------------------------
region_labels = []
region_polygon_files = []
