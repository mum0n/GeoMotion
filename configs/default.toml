# Default movement analysis configuration for GeoMotion
# =============================================================================
# Canonical reference configuration for GeoMotion.
# All parameters are present with their declared defaults and complete explanations.
#
#   julia --project=. GeoMotionRun.jl --config=configs/default.toml \
#          --tagging-file=data/tagging.jld2 \
#          --hsi-file=data/hsi.jld2 --sppoly-file=data/sppoly.jld2
#
# Command-line arguments override values specified in this file.
# =============================================================================

# -----------------------------------------------------------------------------
# Approaches to fit (model_modes)
# -----------------------------------------------------------------------------
# List of inference models to evaluate:
#   "telemetry"            -- Categorical mark-recapture transitions
#   "telemetry_and_survey" -- Joint Negative Binomial survey density + telemetry
#   "agent"                -- Forward agent-based movement simulation
model_modes = ["telemetry", "telemetry_and_survey", "agent"]

# -----------------------------------------------------------------------------
# Input Files
# -----------------------------------------------------------------------------
# Mark-recapture telemetry, habitat suitability, and spatial unit definitions.
# If omitted or null, a synthetic dataset is generated for demonstrations.
# tagging_file    = "data/tagging.jld2"    # Tagging encounters (release/recapture)
# hsi_file        = "data/hsi.jld2"        # Habitat suitability spatial field
# sppoly_file     = "data/sppoly.jld2"     # Spatial polygon areal units
# surveydata_file = "data/surveydata.jld2" # Paired survey abundance data (optional)

# -----------------------------------------------------------------------------
# Spatial Domain and Mesh Partitioning
# -----------------------------------------------------------------------------
# Analysis domain as [west, south, east, north] in degrees. If omitted,
# domain is derived from the bounding box of telemetry records plus padding.
# bbox = [-64.0, 43.0, -59.0, 47.0]
bbox_padding_deg = 0.25

# Land identification method:
#   "landmask"  -- Query global land/sea mask raster (GeoDatasets)
#   "depth"     -- Bathymetry elevation alone (depth <= 0 is land)
#   "polygons"  -- Explicit polygon shapefiles/GeoJSON listed in land_polygon_files
#   "none"      -- Disable barrier masking; all units treated as navigable water
land_source = "landmask"
land_mask_resolution = "l"    # Resolution tier: "c" (crude), "l" (low), "i", "h", "f"
land_mask_grid_minutes = 5.0  # Cell size in arc-minutes (1.25, 2.5, 5.0, 10.0)
land_polygon_files = []       # Optional supplementary polygon files for land barriers

# Hexagonal resharding
reshard_hex = false           # Whether to reshard domain onto a regular hex lattice
hex_radius_km = 10.0          # Hexagonal cell circumradius in kilometres
use_hydrodynamics = false     # Whether to ingest 3D currents, temperature, salinity
depth_barrier_mode = "hsi_only" # "hsi_only" | "bathy_only" | "intersection"
# depth_range = [25.0, 400.0] # Admissible benthic depth bounds in metres (null = any)
hsi_ood_floor = 0.01          # Minimum HSI below which units are out-of-domain

# -----------------------------------------------------------------------------
# Path Reconstruction & Routing
# -----------------------------------------------------------------------------
max_paths = 1000              # Maximum individual trajectories to reconstruct
path_methods = ["astar"]      # Methods: ["astar"], ["viterbi"], or both
smooth_paths = true           # Apply marine line-of-sight path smoothing

# -----------------------------------------------------------------------------
# Advanced Routing & Dynamics
# -----------------------------------------------------------------------------
adaptive_mesh = false         # Multi-resolution adaptive hexagonal mesh
coarse_radius_km = 25.0       # Coarse resolution cell radius (km)
fine_radius_km = 8.0          # Fine resolution cell radius (km)
dynamic_kernels = false       # Time-varying monthly transition kernels
hmm_smoothing = false         # Global multi-segment HMM Viterbi trajectory smoothing

# -----------------------------------------------------------------------------
# Habitat-Coupled Residency
# -----------------------------------------------------------------------------
# Coupling between local habitat advantage and residency probability rho.
# When 0.0, all units share the fitted baseline rho scalar.
rest_advantage = 0.0
# Formulation of local advantage:
#   "difference"     -- delta_h = h_i - mean(h_neighbors)
#   "ratio"          -- h_i / mean(h_neighbors)
#   "log_ratio"      -- log(h_i / mean(h_neighbors))
#   "exp_difference" -- exp(h_i - mean(h_neighbors))
rest_advantage_form = "difference"

# -----------------------------------------------------------------------------
# Bathymetry & Environmental Habitat Sources
# -----------------------------------------------------------------------------
# Ingestion of real physical habitat via GeoData / GeoDataSources:
use_geodata_habitat = false          # Query real bathymetry and bottom temperature
bathymetry_source = "etopo2022"      # "etopo2022", "nwa", or path to .nc/.zarr
temperature_source = "woa23"         # Hydrography provider: "woa23", "glorys12v1"
temperature_month = 0                # Climatological month (0 = annual mean, 1..12)
spatial_averaging = "polygon"        # Averaging mode: "polygon" (area) or "centroid"
hsi_dynamic_method = "glorys_monthly"# Dynamic monthly temperature assimilation series
circuit_timescale = "annual_average" # "annual_average" or "monthly" for circuit theory

# -----------------------------------------------------------------------------
# Forward Agent Projection
# -----------------------------------------------------------------------------
# Directed movement persistence kappa in exp(kappa * cos(bearing - heading)).
# kappa = 0.0 corresponds to a memoryless Markov random walk.
persistence = 0.0
n_headings = 8                # Number of discrete directional heading bins
n_agent_projections = 200     # Number of forward synthetic agent trajectories
agent_horizon = 50            # Simulation step horizon when duration is absent

# -----------------------------------------------------------------------------
# Posterior Inference (MCMC)
# -----------------------------------------------------------------------------
n_samples = 200               # Number of posterior MCMC draws
n_warmup = 100                # Number of warmup/burn-in iterations
seed = 42                     # Master RNG seed for reproducibility
n_ensemble = 50               # Number of draws for Bayesian path ensemble
mh_proposal_scale = 0.05      # Random-walk Metropolis-Hastings proposal scale

# -----------------------------------------------------------------------------
# Habitat Suitability Uncertainty
# -----------------------------------------------------------------------------
hsi_se = 0.08                        # Standard error on HSI observations
propagate_hsi_error = true           # Propagate HSI uncertainty into path sampling
n_stochastic_draws = 10              # Monte Carlo realizations per path
add_structural_uncertainty = false   # Add spatial covariance error to kernel
structural_uncertainty_scale = 0.05  # Scale of structural kernel perturbation

# -----------------------------------------------------------------------------
# Diagnostics & Downstream Analysis
# -----------------------------------------------------------------------------
# List of post-fit diagnostic workflows to execute:
#   "circuit"           -- Electrical network current density and pinchpoints
#   "stochastic"        -- Stochastic least-cost path ensembles
#   "bottlenecks"       -- Domain-wide bottleneck centrality index
#   "validation"        -- Path confidence intervals and predictive checks
#   "bayesian_ensemble" -- Full posterior corridor and trajectory ensembles
diagnostics = ["circuit", "stochastic", "bottlenecks", "validation", "bayesian_ensemble"]

# -----------------------------------------------------------------------------
# Output & Visualization
# -----------------------------------------------------------------------------
species_name = "Animal"       # Species or population label in figures
render_html = true            # Generate interactive Leaflet HTML dashboard
output_dir = "output"         # Target directory for artifacts and figures
resume_from_checkpoint = false# Resume from saved movement_results_checkpoint.jld2
dark_mode = false             # Dark theme for figures and HTML dashboards
cmap = "viridis"              # Colormap for suitability and potential fields
overlay_hsi = false           # Overlay HSI raster on trajectory plots
verbose = true                # Print progress diagnostics to console

# -----------------------------------------------------------------------------
# Stock Connectivity Regions
# -----------------------------------------------------------------------------
# Management units and spatial stock polygons (CSV, JLD2, Shapefile, GeoJSON):
region_labels = []            # e.g. ["Gulf", "Cape Breton"]
region_polygon_files = []     # e.g. ["configs/regions/gulf.geojson"]
# region_map = { 1 = 1, 2 = 1, 3 = 2 } # Explicit unit-to-region index mapping
